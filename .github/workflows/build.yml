name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: stable
          cache: true

      - name: Create Android project
        run: |
          flutter create \
            --platforms=android \
            --org com.khabeir \
            --project-name hotspot_cards \
            .

      - name: Set Android app name
        run: |
          mkdir -p android/app/src/main/res/values

          cat > android/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">بائع الكروت</string>
          </resources>
          EOF

          sed -i 's/android:label="[^"]*"/android:label="@string\/app_name"/' \
            android/app/src/main/AndroidManifest.xml

      - name: Install app icon
        run: |
          mkdir -p \
            android/app/src/main/res/mipmap-mdpi \
            android/app/src/main/res/mipmap-hdpi \
            android/app/src/main/res/mipmap-xhdpi \
            android/app/src/main/res/mipmap-xxhdpi \
            android/app/src/main/res/mipmap-xxxhdpi

          cp assets/app_icon/ic_launcher.png \
            android/app/src/main/res/mipmap-mdpi/ic_launcher.png

          cp assets/app_icon/ic_launcher.png \
            android/app/src/main/res/mipmap-hdpi/ic_launcher.png

          cp assets/app_icon/ic_launcher.png \
            android/app/src/main/res/mipmap-xhdpi/ic_launcher.png

          cp assets/app_icon/ic_launcher.png \
            android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png

          cp assets/app_icon/ic_launcher.png \
            android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          sed -i 's#android:icon="@mipmap/ic_launcher"#android:icon="@mipmap/ic_launcher"#' \
            android/app/src/main/AndroidManifest.xml

      - name: Remove default Flutter test
        run: rm -f test/widget_test.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hotspot-cards-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: hotspot-cards-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
