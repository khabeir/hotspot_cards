name: Build Signed Android APK and AAB

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # 2. Flutter 3.35.0
      # ============================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: stable
          cache: true


      # ============================================================
      # 3. Create Android project
      # ============================================================
      - name: Create Android project
        run: |
          flutter create \
            --platforms=android \
            --org com.khabeir \
            --project-name hotspot_cards \
            .
            
      - name: Relax Kotlin JVM target validation
        run: |
          echo "kotlin.jvm.target.validation.mode=warning" >> android/gradle.properties

      # ============================================================
      # 4. Configure Android JVM 17 globally
      #
      # مهم:
      # لا نستخدم afterEvaluate هنا.
      #
      # هذا الإعداد يفرض Java 17 وKotlin 17 على جميع
      # Android subprojects، بما فيها:
      #
      # file_picker
      # receive_sharing_intent
      # share_plus
      # وغيرها.
      # ============================================================
      - name: Configure Android JVM 17
        run: |
          cat >> android/build.gradle.kts <<'EOF'

          // ==========================================================
          // Global Java / Kotlin JVM 17
          // ==========================================================

          subprojects {
              tasks.withType<JavaCompile>().configureEach {
                  sourceCompatibility = "17"
                  targetCompatibility = "17"
              }

              tasks.withType<
                  org.jetbrains.kotlin.gradle.tasks.KotlinCompile
              >().configureEach {
                  compilerOptions {
                      jvmTarget.set(
                          org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
                      )
                  }
              }
          }
          EOF

          echo "Global Java/Kotlin JVM 17 configured."


      # ============================================================
      # 5. Configure app name
      # ============================================================
      - name: Configure app name
        run: |
          mkdir -p android/app/src/main/res/values

          cat > android/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">بائع الكروت</string>
          </resources>
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text(
              encoding="utf-8"
          )

          # Force the visible application name.
          text = re.sub(
              r'<application\b([^>]*)>',
              lambda m:
                  '<application'
                  + re.sub(
                      r'\s+android:label="[^"]*"',
                      '',
                      m.group(1)
                  )
                  + ' android:label="@string/app_name">',
              text,
              count=1
          )

          manifest.write_text(
              text,
              encoding="utf-8"
          )

          print("App name forced to: بائع الكروت")
          PY

          echo "========================================"
          echo "APPLICATION LINE"
          echo "========================================"
          grep -n "<application" \
            android/app/src/main/AndroidManifest.xml


      # ============================================================
      # 6. Install launcher icon
      # ============================================================
      - name: Install app icon
        run: |
          ICON="assets/app_icon/ic_launcher.png"

          if [ ! -f "$ICON" ]; then
            echo "ERROR: Icon file not found: $ICON"
            exit 1
          fi

          mkdir -p \
            android/app/src/main/res/mipmap-mdpi \
            android/app/src/main/res/mipmap-hdpi \
            android/app/src/main/res/mipmap-xhdpi \
            android/app/src/main/res/mipmap-xxhdpi \
            android/app/src/main/res/mipmap-xxxhdpi

          cp "$ICON" \
            android/app/src/main/res/mipmap-mdpi/ic_launcher.png

          cp "$ICON" \
            android/app/src/main/res/mipmap-hdpi/ic_launcher.png

          cp "$ICON" \
            android/app/src/main/res/mipmap-xhdpi/ic_launcher.png

          cp "$ICON" \
            android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png

          cp "$ICON" \
            android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          echo "Launcher icon installed."


      # ============================================================
      # 7. Remove default adaptive launcher icon
      # ============================================================
      - name: Remove default adaptive icon
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          rm -rf android/app/src/main/res/mipmap-anydpi

          rm -f \
            android/app/src/main/res/drawable/ic_launcher_foreground.xml

          rm -f \
            android/app/src/main/res/drawable/ic_launcher_foreground.png

          echo "Default adaptive launcher icon removed."


      # ============================================================
      # 8. Configure launcher icon in manifest
      # ============================================================
      - name: Configure launcher manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text(
              encoding="utf-8"
          )

          # Remove existing android:icon attributes.
          text = re.sub(
              r'\s+android:icon="[^"]*"',
              '',
              text,
              count=1
          )

          # Add our launcher icon.
          text = text.replace(
              "<application",
              '<application android:icon="@mipmap/ic_launcher"',
              1
          )

          manifest.write_text(
              text,
              encoding="utf-8"
          )

          print("Launcher manifest configured.")
          PY


      # ============================================================
      # 9. Configure MainActivity
      #
      # يحول ACTION_VIEW إلى ACTION_SEND حتى يستطيع
      # receive_sharing_intent استقبال ملف CSV.
      # ============================================================
      - name: Configure MainActivity for CSV
        run: |
          mkdir -p \
            android/app/src/main/kotlin/com/khabeir/hotspot_cards

          cat > android/app/src/main/kotlin/com/khabeir/hotspot_cards/MainActivity.kt <<'EOF'
          package com.khabeir.hotspot_cards

          import android.content.Intent
          import android.os.Bundle
          import io.flutter.embedding.android.FlutterActivity

          class MainActivity : FlutterActivity() {

              override fun onCreate(
                  savedInstanceState: Bundle?
              ) {
                  normalizeViewIntent(intent)
                  super.onCreate(savedInstanceState)
              }

              override fun onNewIntent(intent: Intent) {
                  normalizeViewIntent(intent)
                  super.onNewIntent(intent)
              }

              private fun normalizeViewIntent(
                  source: Intent?
              ) {
                  if (source?.action != Intent.ACTION_VIEW) {
                      return
                  }

                  val uri = source.data ?: return

                  val normalized = Intent(
                      Intent.ACTION_SEND
                  ).apply {
                      type = source.type ?: "text/csv"

                      putExtra(
                          Intent.EXTRA_STREAM,
                          uri
                      )

                      addFlags(source.flags)
                  }

                  setIntent(normalized)
              }
          }
          EOF

          echo "MainActivity configured."


      # ============================================================
      # 10. Configure CSV Open With + Share
      # ============================================================
      - name: Configure CSV open-with support
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text(
              encoding="utf-8"
          )

          activity_pattern = (
              r'(<activity\b'
              r'[^>]*android:name="\.MainActivity"'
              r'[^>]*>)'
              r'(.*?)'
              r'(</activity>)'
          )

          match = re.search(
              activity_pattern,
              text,
              re.DOTALL
          )

          if not match:
              raise SystemExit(
                  "ERROR: MainActivity activity was not found."
              )

          activity_open = match.group(1)
          activity_body = match.group(2)
          activity_close = match.group(3)

          # ----------------------------------------------------------
          # Remove old CSV VIEW filters.
          # ----------------------------------------------------------

          activity_body = re.sub(
              r'\s*<intent-filter>\s*'
              r'<action android:name="android\.intent\.action\.VIEW"\s*/>\s*'
              r'<category android:name="android\.intent\.category\.DEFAULT"\s*/>\s*'
              r'<data android:mimeType="(?:text/csv|application/csv|text/comma-separated-values)"\s*/>\s*'
              r'</intent-filter>',
              '',
              activity_body,
              flags=re.DOTALL
          )

          # ----------------------------------------------------------
          # Remove old CSV SEND filters.
          # ----------------------------------------------------------

          activity_body = re.sub(
              r'\s*<intent-filter>\s*'
              r'<action android:name="android\.intent\.action\.SEND"\s*/>\s*'
              r'<category android:name="android\.intent\.category\.DEFAULT"\s*/>\s*'
              r'<data android:mimeType="(?:text/csv|application/csv|text/comma-separated-values)"\s*/>\s*'
              r'</intent-filter>',
              '',
              activity_body,
              flags=re.DOTALL
          )

          # ----------------------------------------------------------
          # CSV intent filters.
          # ----------------------------------------------------------

          filters = r'''
              <intent-filter>
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <data android:mimeType="text/csv" />
              </intent-filter>

              <intent-filter>
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <data android:mimeType="application/csv" />
              </intent-filter>

              <intent-filter>
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <data android:mimeType="text/comma-separated-values" />
              </intent-filter>

              <intent-filter>
                  <action android:name="android.intent.action.SEND" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <data android:mimeType="text/csv" />
              </intent-filter>

              <intent-filter>
                  <action android:name="android.intent.action.SEND" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <data android:mimeType="application/csv" />
              </intent-filter>

              <intent-filter>
                  <action android:name="android.intent.action.SEND" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <data android:mimeType="text/comma-separated-values" />
              </intent-filter>
          '''

          new_activity = (
              activity_open
              + activity_body
              + filters
              + activity_close
          )

          text = (
              text[:match.start()]
              + new_activity
              + text[match.end():]
          )

          manifest.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "CSV Open With and Share intent filters "
              "configured successfully."
          )
          PY


      # ============================================================
      # 11. Remove default Flutter test
      # ============================================================
      - name: Remove default Flutter test
        run: |
          rm -f test/widget_test.dart


      # ============================================================
      # 12. Get dependencies
      # ============================================================
      - name: Flutter pub get
        run: |
          flutter pub get


      # ============================================================
      # 13. Analyze
      # ============================================================
      - name: Flutter analyze
        run: |
          flutter analyze


      # ============================================================
      # 14. Prepare release keystore
      # ============================================================
      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          mkdir -p android/keystore

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > android/keystore/baye_al_cards_new.jks

          test -s \
            android/keystore/baye_al_cards_new.jks

          echo "Release keystore prepared successfully."


      # ============================================================
      # 15. Create key.properties
      # ============================================================
      - name: Create key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS secret is missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD secret is missing."
            exit 1
          fi

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=keystore/baye_al_cards_new.jks
          EOF

          echo "key.properties created."


      # ============================================================
      # 16. Configure release signing
      #
      # Flutter 3.35 generates Kotlin DSL.
      # ============================================================
      - name: Configure release signing
        run: |
          cat > android/app/build.gradle.kts <<'EOF'
          import java.io.FileInputStream
          import java.util.Properties

          plugins {
              id("com.android.application")
              id("kotlin-android")
              id("dev.flutter.flutter-gradle-plugin")
          }

          val keystoreProperties = Properties()

          val keystorePropertiesFile =
              rootProject.file("key.properties")

          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(
                  FileInputStream(
                      keystorePropertiesFile
                  )
              )
          }

          android {
              namespace = "com.khabeir.hotspot_cards"

              compileSdk =
                  flutter.compileSdkVersion

              ndkVersion =
                  flutter.ndkVersion

              defaultConfig {
                  applicationId =
                      "com.khabeir.hotspot_cards"

                  minSdk =
                      flutter.minSdkVersion

                  targetSdk =
                      flutter.targetSdkVersion

                  versionCode =
                      flutter.versionCode

                  versionName =
                      flutter.versionName
              }

              // ======================================================
              // Java 17
              // ======================================================
              compileOptions {
                  sourceCompatibility =
                      JavaVersion.VERSION_17

                  targetCompatibility =
                      JavaVersion.VERSION_17
              }

              // ======================================================
              // Kotlin 17
              // ======================================================
              kotlinOptions {
                  jvmTarget =
                      JavaVersion.VERSION_17.toString()
              }

              // ======================================================
              // Release signing
              // ======================================================
              signingConfigs {
                  create("release") {
                      keyAlias =
                          keystoreProperties.getProperty(
                              "keyAlias"
                          )

                      keyPassword =
                          keystoreProperties.getProperty(
                              "keyPassword"
                          )

                      storePassword =
                          keystoreProperties.getProperty(
                              "storePassword"
                          )

                      storeFile =
                          keystoreProperties
                              .getProperty("storeFile")
                              ?.let {
                                  rootProject.file(it)
                              }
                  }
              }

              // ======================================================
              // Release build
              // ======================================================
              buildTypes {
                  getByName("release") {
                      signingConfig =
                          signingConfigs.getByName(
                              "release"
                          )
                  }
              }
          }

          flutter {
              source = "../.."
          }
          EOF

          echo "Release signing configured."


      # ============================================================
      # 17. Verify Android configuration
      # ============================================================
      - name: Verify Android configuration
        run: |
          echo "========================================"
          echo "ROOT BUILD.GRADLE.KTS"
          echo "========================================"

          cat android/build.gradle.kts

          echo
          echo "========================================"
          echo "APP BUILD.GRADLE.KTS"
          echo "========================================"

          cat android/app/build.gradle.kts

          echo
          echo "========================================"
          echo "ANDROID MANIFEST"
          echo "========================================"

          cat android/app/src/main/AndroidManifest.xml

          echo
          echo "========================================"
          echo "MAIN ACTIVITY"
          echo "========================================"

          cat \
            android/app/src/main/kotlin/com/khabeir/hotspot_cards/MainActivity.kt

          echo
          echo "========================================"
          echo "LAUNCHER ICONS"
          echo "========================================"

          find android/app/src/main/res \
            -type f \
            | sort

          echo
          echo "========================================"
          echo "KEYSTORE"
          echo "========================================"

          ls -lh \
            android/keystore/baye_al_cards_new.jks


      # ============================================================
      # 18. Clean
      # ============================================================
      - name: Flutter clean
        run: |
          flutter clean


      # ============================================================
      # 19. Build signed APK
      # ============================================================
      - name: Build signed APK
        run: |
          flutter build apk --release


      # ============================================================
      # 20. Build signed AAB
      # ============================================================
      - name: Build signed AAB
        run: |
          flutter build appbundle --release


      # ============================================================
      # 21. Prepare release artifacts
      # ============================================================
      - name: Prepare release artifacts
        run: |
          mkdir -p release

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            release/baye_al_cards-release.apk

          cp \
            build/app/outputs/bundle/release/app-release.aab \
            release/baye_al_cards-release.aab

          echo
          echo "========================================"
          echo "RELEASE FILES"
          echo "========================================"

          ls -lh release/


      # ============================================================
      # 22. Upload APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: baye-al-cards-release-apk
          path: release/baye_al_cards-release.apk


      # ============================================================
      # 23. Upload AAB
      # ============================================================
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: baye-al-cards-release-aab
          path: release/baye_al_cards-release.aab


      # ============================================================
      # 24. Cleanup signing files
      # ============================================================
      - name: Cleanup signing files
        if: always()
        run: |
          rm -f android/key.properties
          rm -f android/keystore/baye_al_cards_new.jks